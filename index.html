<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="candidatos.css">
    <link rel="stylesheet" href="rsultado.css">
</head>
<body>
    <header>
        <h1 id="titulo">Urna da Turma</h1>
        <nav id ="nav-bar">
            <button class="aba ativa" data-tela="votacao">Votar</button>
            <button class="aba" data-tela="candidatos">Candidatos</button>
            <button  class="aba" data-tela="resultado">Resultado</button>
            
        </nav>
        <hr>
    </header>

    <main>
        <section id="votacao" class="tela ativa">
            <div class="urna">
                <h2 class="rotulo">Digite o número do seu candidato</h2>
                <div class="botoes-urna">
                    
                    <button id="btnBranco" class="branco">Branco</button>
                    <button id="btnCorrige" class="corrige">Corrige</button>
                    <button id="btnConfirma" class="confirma">Confirma</button>
                </div>


                <div class="visor">
                    <input type="text" id="numerovoto" maxlength="2" inputmode="numeric" autocomplete="off">
                    <div id="previa" class="previa"></div>
                </div>
            </div>
        </section>

        <section>
            <div id="fim" class="fim">Fim</div>
            <button id="btn_voltar" class="btn_voltar">Clique aqui para que outra pessoa possa votar.</button>
        </section>

<!-- ------------------------------------------------------------------->
         <section id="candidatos" class="tela">
            <div id="separamento">
                <h2>Cadastrar candidatos</h2>
                <form id="formCandidato">
                    <input type="text" id="nomeCandidato" placeholder="Nome do aluno" required>
                    <input type="text" id="numeroCandidato" placeholder="Numero (ex:10)" maxlength="2" inputmode="numeric">
                    <button type="submit" id="botao_adicionar">Adicionar</button>
                </form>
            </div>

            <div id ="separamento2">
                <h2 id="candidatos_cadastrados">Candidatos cadastrados</h2>
                <ul id="listaCandidatos"></ul>
            </div>
         </section>
<!-- ----------------------------------------------------------------- -->
         <section id="resultado" class="tela">
            <h2>Apuração</h2>
            <p id="totalVotos"></p>
            <div id="listaResultado"></div>
            <button id="btnZerar" class="perigo">Zerar votos</button>
         </section>
<!-- ----------------------------------------------------------------- -->   
         <section id="login_cadastro" class="tela">
                <h1>Login para Adiministradores</h1>
                    <div>
                        <p>digite o nome de usuario</p>
                        <input type="text" id="usuario" >
                        <p>digite sua senha de usuario</p>
                        <input type="text" id="senha" >
                        <button id="btn_entrar" class="aba" data-tela="btn_entrar">Entrar</button>
                    </div>
         </section>
<!-- -------------------------------------F---------------------------- -->




    </main>

    <script src="script.js"></script>
</body>
</html>
